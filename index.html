<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141c26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/logo-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/logo-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/logo-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="nrgfm">
<meta name="robots" content="noindex, nofollow">
<title>nrgfm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="themes/blue-theme.css?v=dev">
<link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
<header class="top">
  <h1 class="brand"><a href="#" id="home" aria-expanded="false" aria-controls="menu" title="Menu">nrgfm</a></h1>
  <label class="search">
    <span class="sr">Search tracks</span>
    <input id="q" type="search" placeholder="Search artist, title or tag" autocomplete="off" spellcheck="false">
    <button id="clearQ" class="btn ghost square" type="button" aria-label="Clear search" hidden>×</button>
  </label>
  <button id="addBtn" class="btn" aria-expanded="false" aria-controls="addPanel">Add track</button>
  <div id="addPanel" class="add-panel" hidden></div>
  <nav id="menu" class="menu" hidden>
    <button data-view="threads">Threads</button>
    <button data-view="tags">Tags</button>
    <button data-view="mixes">Mixes</button>
    <button data-view="genres">Genres</button>
    <button data-view="history">History</button>
    <button data-view="random">Random</button>
    <button data-view="ublock" class="menu-right" title="A free ad blocker: no ads before the YouTube videos">uBlock Origin Lite</button>
  </nav>
</header>

<main>
  <div id="viewHead" class="view-head" hidden></div>
  <p id="resultInfo" class="result-info" hidden></p>
  <ol id="threads" class="threads"></ol>
  <div id="more" class="more"></div>
</main>

<section id="dock" class="dock" hidden aria-label="Player">
  <div class="media-row"><div id="media" class="media"><div id="ytSlot" class="slot" hidden></div><div id="otherSlot" class="slot"></div></div></div>
  <div class="bar">
    <div id="threadPop" class="thread-pop" hidden>
      <ol id="threadList" class="thread-list"></ol>
    </div>
    <div class="seekrow">
      <span id="tCur" class="time">0:00</span>
      <input id="seek" class="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Position in track">
      <span id="tDur" class="time">0:00</span>
    </div>
    <div class="ctrlrow">
      <div class="transport">
        <button id="prevBtn" class="ctl" aria-label="Previous track in thread">Prev</button>
        <button id="playBtn" class="ctl play" aria-pressed="false">Play</button>
        <button id="nextBtn" class="ctl" aria-label="Next track in thread">Next</button>
      </div>
      <div class="now">
        <strong id="nowTitle"></strong>
        <button id="threadBtn" class="thread-btn" aria-expanded="false" aria-controls="threadPop" title="Show all tracks in this thread"></button>
        <button id="editBtn" class="thread-btn" title="Edit the playing track">edit</button>
        <button id="sourceBtn" class="thread-btn" title="Go to the thread this track was posted in">source</button>
        <button id="discogsBtn" class="thread-btn" title="Search Google for this track on Discogs">discogs</button>
      </div>
      <div class="opts">
        <span id="volWrap" class="vol-wrap">
          <button id="volBtn" class="ctl" aria-expanded="false" aria-controls="volPop" title="Volume">100</button>
          <span id="volNum" class="vol-num" hidden></span>
          <span id="volPop" class="vol-pop" hidden>
            <input id="vol" class="seek" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
            <span id="volVal" class="time">100</span>
          </span>
        <button id="autoBtn" class="ctl toggle" aria-pressed="false" title="Play through the rest of the thread">Autoplay off</button>
        </span>
        <button id="infoBtn" class="ctl" title="Copy artist and title of the playing track">Copy info</button>
        <button id="copyBtn" class="ctl" title="Copy the link of the playing track">Copy link</button>
        <button id="closeBtn" class="ctl close-btn" title="Hide the player">Close</button>
      </div>
    </div>
  </div>
</section>


<dialog id="setupDlg" class="dlg">
  <form id="setupForm">
    <h2>Adding tracks on this device</h2>
    <p class="hint">Paste your GitHub key (fine-grained token with access to only the nrgfm repository, Contents: read and write). It is stored in this browser only.</p>
    <label>Key
      <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
    </label>
    <p id="setupMsg" class="hint" role="status"></p>
    <div class="row">
      <button type="button" class="btn ghost" id="tokenRemove" hidden>Remove key</button>
      <button type="button" class="btn ghost" id="setupClose">Close</button>
      <button type="submit" class="btn">Save key</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=dev"></script>
</body>
</html>

name: Recover titles of dead links

# Looks up deleted/private links in the Internet Archive in batches of 300,
# every 3 hours until all are checked (then each run finishes in seconds).
# After saving results it starts "Update and publish" so the site shows them.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wayback
  cancel-in-progress: false

jobs:
  wayback:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look up dead links in the Wayback Machine
        run: python3 scripts/wayback_titles.py 300
      - name: Commit and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nrgproduct"
          git config user.email "nrgproduct@users.noreply.github.com"
          git add data/meta.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Recover titles of dead links from the Wayback Machine"
          git pull --rebase origin main
          git push
          gh workflow run update.yml --ref main

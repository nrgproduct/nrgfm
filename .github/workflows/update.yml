name: Update and publish

# On every push to main (including tracks added through the site's "Add track" button):
# 1. move new tracks from inbox/ into data/tracks.json
# 2. fetch missing titles/thumbnails (cached in data/meta.json)
# 3. commit those changes and publish the site to GitHub Pages.
# Requires: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # always start from the newest version (not the commit that triggered the run),
      # so quick clicks on the site can't make runs trip over each other
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add new tracks from inbox
        run: python3 scripts/ingest_inbox.py
      - name: Fetch missing titles
        run: python3 scripts/fetch_meta.py
      - name: Automatic tags (duplicate, +10 min / +30 min / +1 hour)
        run: python3 scripts/auto_tags.py
      - name: Commit changes
        run: |
          git config user.name "nrgproduct"
          git config user.email "nrgproduct@users.noreply.github.com"
          git add -A data inbox
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Update tracks and titles"
          # if something else was saved meanwhile: start over from the newest version (up to 3 times)
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main && git reset --hard origin/main
            python3 scripts/ingest_inbox.py
            python3 scripts/fetch_meta.py
            python3 scripts/auto_tags.py
            git add -A data inbox
            git diff --cached --quiet && exit 0
            git commit -m "Update tracks and titles"
          done
          exit 1
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html app.js style.css manifest.webmanifest icons themes data _site/
          touch _site/.nojekyll
          # new file names on every update, so browsers never keep an old style or script
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}/g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

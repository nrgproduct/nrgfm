name: Update and publish

# On every push to main (including tracks added through the site's "Add track" button):
# 1. move new tracks from inbox/ into data/tracks.json
# 2. fetch missing titles/thumbnails (cached in data/meta.json)
# 3. commit those changes and publish the site to GitHub Pages.
# Requires: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add new tracks from inbox
        run: python3 scripts/ingest_inbox.py
      - name: Fetch missing titles
        run: python3 scripts/fetch_meta.py
      - name: Commit changes
        run: |
          git config user.name "nrgproduct"
          git config user.email "nrgproduct@users.noreply.github.com"
          git add -A data inbox
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Update tracks and titles"
          git pull --rebase origin main
          git push
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html app.js style.css data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

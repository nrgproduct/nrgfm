name: Gemini suggestions

# Gemini decides the suggested release, year and genres from what the lookups found, and looks up tracks
# where nothing was found. Runs in batches every 6 hours (the free tier allows a limited number of requests
# per day; when they run out it stops and carries on next run). Needs the repository secret GEMINI_API_KEY.
on:
  schedule:
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "How many tracks to ask about"
        default: "1000"

permissions:
  contents: write
  actions: write

concurrency:
  group: gemini
  cancel-in-progress: false

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/gemini.py ${{ inputs.max || '1000' }} 75
      - name: Save and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nrgproduct"
          git config user.email "nrgproduct@users.noreply.github.com"
          git add data/ai.json data/gemini-status.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Gemini suggestions"
          git pull --rebase origin main
          git push
          gh workflow run update.yml --ref main
